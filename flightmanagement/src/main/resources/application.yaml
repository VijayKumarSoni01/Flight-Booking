spring:
  application:
    name: usermanagment

  datasource:
    url: jdbc:mysql://localhost:3306/flightserver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    

app:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION_TIME:1800000}
    refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800000}

logging:
  file:
    name: logs/app.log