server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: usermanagment

  datasource:
    url: jdbc:mysql://localhost:3306/flightbooking
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USER:test}
    password: ${BREVO_SMTP_KEY:test}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    

app:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION_TIME:1800000}
    refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800000}

  mail:
    from-email: ${BREVO_FROM_EMAIL}
    from-name: ${BREVO_FROM_NAME}
    base-url: ${APP_BASE_URL}
    verification-expiry-minutes: ${EMAIL_VERIFICATION_EXPIRY_MINUTES:15}

logging:
  file:
    name: logs/app.log

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}   
  phone-number: ${TWILIO_PHONE_NUMBER} 

otp:
  length: ${OTP_LENGTH:6}
  expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  max-attempts: ${OTP_MAX_ATTEMPTS:3}