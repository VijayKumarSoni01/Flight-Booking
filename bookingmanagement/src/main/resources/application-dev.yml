server:
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/booking_management
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

flight:
  service:
    url: http://localhost:8082

payment :
  service:
    url: http://localhost:8084
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html