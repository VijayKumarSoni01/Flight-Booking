server:
  port: 8083

spring:
  application:
    name: booking-management

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.schema]": DEBUG
    "[org.hibernate.tool.schema]": DEBUG

  file:
    name: logs/app.log

app:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-time: ${JWT_EXPIRATION_TIME:1800000}
    refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:604800000}