server:
  address: 0.0.0.0

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

flight:
  service:
    url: ${FLIGHT_SERVICE_URL}

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false